server {
    listen       80;
    server_name  admin.8c65061.com;
    root         /home/www/conversion-admin-react/dist;

    charset utf-8;
    server_tokens off;


    # Adds the specified field to a response header provided that the response code equals 
    # 200, 201 (1.3.10), 204, 206, 301, 302, 303, 304, 307 (1.1.16, 1.0.13), or 308 (1.13.0). 
    # Parameter value can contain variables.
    # If the always parameter is specified (1.7.5), the header field will be added regardless of the response code.

    index        index.html index.htm; 
    
    # Load configuration files for the default server block.
	
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # 服务器体验优化，nginx 异常一样回传 *.json 格式
    error_page   404  /404.json;
    error_page   502  /502.json;
    error_page   504  /504.json;

    error_page   400 401 403 405 406 407 408 409 410  /40x.json;
    error_page   500 501 503 505 506 507 508 509 510  /50x.json;

    # 拒绝所有环境变量 外泄
    location ~* (\.env|\.env\.dev|\.env\.example|\.gitignore|\.gitlab-ci\.yml|\.md|\.ini|package\.json|package-lock\.json|pm2\.json|composer\.json|composer\.lock|\.sh)$ {
        deny all;
    }

    location ~* \.(m3u8|ts|mp4|avi|wmv|rm|rmvb|mkv|mp3|wma|wav|aac|txt|pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar)(\?.+)?$ {
        expires max;
        max_ranges 100; # cannot use 0
    }

    location ~* \.(ico|bmp|bmp4|css|js|gif|jpe?g|png|ogg|ogv|svg|svgz|eot|otf|woff)(\?.+)?$ {
        expires max;
        log_not_found off;
    }

    location / {
        rewrite ^/$ /admin permanent;
    }




      location /admin {
        try_files $uri $uri/ /admin/index.html;
    }


}
